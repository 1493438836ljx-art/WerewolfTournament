name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (engine rules / protocol / runner integration / referee fallback)
        run: pnpm test

  # 纯引擎模拟（无进程、无 DB）：随机种子跑完整对局验证终局
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wt/engine --filter @wt/protocol build
      - name: Simulate random games (5 seeds)
        run: |
          for s in ci-1 ci-2 ci-3 ci-4 ci-5; do pnpm sim "$s" --quiet; done
